<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What Should I Wear?</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>What Should I Wear?</h1>
      <p class="subtitle">Search a place to get clothing advice based on the weather.</p>
    </header>

    <div class="region-toggle" role="group" aria-label="Choose a region">
      <button type="button" class="region-btn is-active" data-region="england">England</button>
      <button type="button" class="region-btn" data-region="california">California</button>
    </div>

    <form id="search-form" class="search">
      <input
        type="text"
        id="search-input"
        placeholder="Search any place in England, e.g. Leeds"
        autocomplete="off"
      />
      <button type="submit">Search</button>
    </form>

    <div class="activity">
      <label for="activity-select">What are you doing?</label>
      <select id="activity-select">
        <option value="out">Out and about</option>
        <option value="walking">Walking</option>
        <option value="running">Running</option>
        <option value="cycling">Cycling</option>
        <option value="gardening">Gardening</option>
        <option value="chilling">Chilling indoors</option>
      </select>
    </div>

    <p id="status" class="status" role="status"></p>

    <section id="result" class="result" hidden>
      <div class="weather-card">
        <h2 id="place-name"></h2>
        <div class="weather-main">
          <span id="weather-icon" class="weather-icon"></span>
          <span id="temperature" class="temperature"></span>
        </div>
        <p id="conditions" class="conditions"></p>
        <ul class="weather-details">
          <li>Feels like <span id="feels-like"></span></li>
          <li>Wind <span id="wind"></span></li>
          <li>Rain chance <span id="rain"></span></li>
        </ul>
      </div>

      <div class="clothing-card">
        <h3 id="clothing-heading">Wear this</h3>
        <ul id="clothing-list"></ul>
      </div>

      <div class="forecast-card">
        <h3 id="forecast-heading">The week ahead</h3>
        <ul id="forecast-list"></ul>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
